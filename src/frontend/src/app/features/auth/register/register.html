<div class="min-h-[calc(100vh-8rem)] bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-300 flex items-center justify-center">
  <div class="max-w-md w-full mx-auto px-6 py-12 text-center">
    
    <!-- Visual Accent Icon -->
    <div class="inline-flex p-4 rounded-2xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 mb-6">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
      </svg>
    </div>

    <!-- Title / Notice Header -->
    <h1 class="text-3xl font-black tracking-tight mb-4 text-slate-900 dark:text-white">
      {{ langService.translate('register.title') }}
    </h1>

    <!-- Core Message -->
    <p class="text-base text-slate-600 dark:text-slate-400 mb-8 leading-relaxed font-medium">
      {{ langService.translate('register.message') }}
    </p>

    <!-- Call to Action Link to Demo Site -->
    <div class="space-y-4">
      <a 
        href="https://democredentials.ahmetmahirdemirelli.com" 
        target="_blank" 
        rel="noopener noreferrer"
        class="block w-full px-6 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition-colors shadow-md shadow-indigo-600/10 text-center"
      >
        {{ langService.translate('register.cta') }}
      </a>

      <!-- Back to Home Action -->
      <button 
        type="button"
        (click)="navigateToHome()"
        class="block w-full px-6 py-3.5 bg-transparent hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400 font-semibold rounded-xl transition-colors text-center border border-slate-200 dark:border-slate-800"
      >
        {{ langService.translate('register.backHome') }}
      </button>
    </div>

  </div>
</div>
