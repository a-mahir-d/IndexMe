<div class="min-h-screen bg-slate-50 dark:bg-slate-950 p-6">
  <div class="max-w-4xl mx-auto" *ngIf="user() as u">
    
    <div class="bg-white dark:bg-slate-900 p-6 rounded-2xl border border-slate-200 dark:border-slate-800 mb-6">
      <h1 class="text-2xl font-black text-slate-900 dark:text-white">@{{ u.username }}</h1>
      <p class="text-indigo-600 dark:text-indigo-400 font-semibold">{{ u.displayName }}</p>
      <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">{{ u.bio }}</p>
    </div>

    <div class="space-y-4">
      <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-4">
        {{ langService.translate('dashboard.linksTitle') }}
      </h2>

      <div *ngFor="let link of u.links" class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-4">
          <div class="px-3 py-1 bg-slate-100 dark:bg-slate-800 rounded-lg text-xs font-bold text-slate-500">
            #{{ link.displayOrder }}
          </div>
          <div>
            <h3 class="font-semibold text-slate-900 dark:text-white">{{ link.title }}</h3>
            <a [href]="link.url" target="_blank" class="text-xs text-indigo-600 dark:text-indigo-400 truncate max-w-[250px] block">
              {{ link.url }}
            </a>
          </div>
        </div>
        
        <div class="flex flex-col items-end">
          <span class="text-2xl font-black text-slate-900 dark:text-white">
            {{ link.clickCount }}
          </span>
          <span class="text-[10px] uppercase tracking-widest text-slate-500 font-bold">
            {{ langService.translate('dashboard.clicksLabel') }}
          </span>
        </div>
      </div>
      
      <div *ngIf="u.links.length === 0" class="text-center py-10 text-slate-500">
        {{ langService.translate('dashboard.noLinks') }}
      </div>
    </div>
  </div>
</div>
