<div class="min-h-[calc(100vh-8rem)] bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-300 flex items-center">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 text-center">
    
    <h1 class="text-4xl sm:text-6xl font-black tracking-tight leading-none mb-6">
      {{ langService.translate('home.title') }}
      <span class="text-indigo-600 dark:text-indigo-400 block sm:inline">
        {{ langService.translate('home.titleHighlight') }}
      </span>
    </h1>

    <p class="text-lg sm:text-xl text-slate-600 dark:text-slate-400 max-w-2xl mx-auto mb-10 font-medium">
      {{ langService.translate('home.subtitle') }}
    </p>

    <div class="max-w-md mx-auto">
      <div class="flex flex-col sm:flex-row gap-3 shadow-xs bg-slate-50 dark:bg-slate-800/50 p-2 rounded-2xl border border-slate-200 dark:border-slate-800">
        <div class="flex items-center px-3 flex-1 text-slate-500 dark:text-slate-400 font-semibold text-base">
          <span>indexme.com/</span>
          <input 
            type="text" 
            [placeholder]="langService.translate('home.placeholder')" 
            readonly
            class="w-full bg-transparent border-0 p-1 ml-0.5 text-slate-900 dark:text-white focus:ring-0 focus:outline-hidden font-normal select-none"
          />
        </div>
        <button 
          type="button"
          (click)="navigateToRegister()"
          class="w-full sm:w-auto px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition-colors shadow-md shadow-indigo-600/10 cursor-pointer whitespace-nowrap"
        >
          {{ langService.translate('home.cta') }}
        </button>
      </div>
    </div>

  </div>
</div>
